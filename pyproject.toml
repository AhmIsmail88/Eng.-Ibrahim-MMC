[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eng-ibrahim-cmms"
version = "0.10.0"
description = "ENG. IBRAHIM - Maintenance Management System (offline Windows desktop CMMS)"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "SQLAlchemy>=2.0,<2.2",
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1",
  "openpyxl>=3.1,<4",
  "xlsxwriter>=3.1,<4",
  "qrcode>=7.4",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eng_ibrahim = ["localization/*.json", "localization/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
ignore = ["C408", "E501", "B008"]

[tool.pyside6.deploy]
title = "ENG. IBRAHIM"
input_file = "main.py"
exec_directory = "dist"
icon = "assets/icons/ENG_IBRAHIM_Icon.ico"
mode = "standalone"

[tool.mypy]
# Blocking in CI for the layers below the UI (review F-21); the Qt pages are checked
# informally until PySide6's stubs and our widgets agree.
python_version = "3.12"
files = ["src/eng_ibrahim/domain", "src/eng_ibrahim/infrastructure", "src/eng_ibrahim/application"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*", "xlsxwriter", "xlsxwriter.*", "qrcode", "qrcode.*", "reportlab", "reportlab.*"]
ignore_missing_imports = true
